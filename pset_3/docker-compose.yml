# MLflow para el PSet 3: tracking + registro de modelos.
#   docker compose up -d   ->  UI en http://127.0.0.1:5050
services:
  mlflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
    volumes:
      - mlflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER:-mlflow}"]
      interval: 5s
      retries: 10

  mlflow:
    build: ./mlflow
    depends_on:
      mlflow-db:
        condition: service_healthy
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@mlflow-db:5432/${MLFLOW_DB_NAME:-mlflow}
      --serve-artifacts --artifacts-destination /mlartifacts
    ports:
      - "5050:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts

volumes:
  mlflow-db:
  mlflow-artifacts:
