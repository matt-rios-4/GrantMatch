# Carga manual y acotada a un solo objeto Parquet confirmado con LIST.
# No agregar triggers ni ampliar FILES a una carpeta.
id: copy_single_openalex_author_file
namespace: pset2

inputs:
  - id: s3_file_key
    type: STRING
    required: true
    displayName: Clave exacta del archivo Parquet
    description: >-
      Ruta relativa al stage, copiada de un resultado de LIST; por ejemplo,
      authors/<archivo>.parquet. No incluir el bucket ni la carpeta base.
    validator: '^authors/[A-Za-z0-9_=-][A-Za-z0-9_.=-]*(/[A-Za-z0-9_=-][A-Za-z0-9_.=-]*)*\.parquet$'

tasks:
  - id: copy_one_file_to_bronze
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: >-
      COPY INTO PSET2_DB.BRONZE.RAW_OPENALEX_AUTHORS
        (PAYLOAD, _LOADED_AT, _SOURCE_FILE, _RUN_ID)
      FROM (
        SELECT
          $1,
          METADATA$START_SCAN_TIME::TIMESTAMP_TZ,
          METADATA$FILENAME,
          '{{ execution.id }}'
        FROM @PSET2_DB.BRONZE.OPENALEX_PARQUET_STAGE
      )
      FILES = ('{{ inputs.s3_file_key }}')
      FILE_FORMAT = (FORMAT_NAME = PSET2_DB.BRONZE.OPENALEX_PARQUET_FORMAT)
      ON_ERROR = 'ABORT_STATEMENT'
      FORCE = FALSE
    fetchType: FETCH
