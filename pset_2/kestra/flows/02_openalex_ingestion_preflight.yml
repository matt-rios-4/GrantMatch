# Solo lectura. Diagnostica objetos, rutas y cargas existentes antes de planificar COPY.
# No agregar tareas COPY, DDL ni triggers a este flow.
id: openalex_ingestion_preflight
namespace: pset2

tasks:
  - id: snowflake_session_context
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: >-
      SELECT CURRENT_ACCOUNT() AS ACCOUNT_NAME,
             CURRENT_USER() AS USER_NAME,
             CURRENT_ROLE() AS ROLE_NAME,
             CURRENT_WAREHOUSE() AS WAREHOUSE_NAME,
             CURRENT_DATABASE() AS DATABASE_NAME,
             CURRENT_SCHEMA() AS SCHEMA_NAME
    fetchType: FETCH_ONE

  - id: show_bronze_stages
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: "SHOW STAGES IN SCHEMA PSET2_DB.BRONZE"
    fetchType: FETCH

  - id: show_bronze_file_formats
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: "SHOW FILE FORMATS IN SCHEMA PSET2_DB.BRONZE"
    fetchType: FETCH

  - id: show_bronze_tables
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: "SHOW TABLES IN SCHEMA PSET2_DB.BRONZE"
    fetchType: FETCH

  - id: describe_authors_stage
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: "DESC STAGE PSET2_DB.BRONZE.OPENALEX_PARQUET_STAGE"
    fetchType: FETCH

  - id: describe_works_stage
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: "DESC STAGE PSET2_DB.BRONZE.OPENALEX_WORKS_STAGE"
    fetchType: FETCH

  - id: list_authors_files_under_dataset_prefix
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: "LIST @PSET2_DB.BRONZE.OPENALEX_PARQUET_STAGE/authors/ PATTERN = '.*[.]parquet$'"
    fetchType: FETCH

  - id: list_works_files_under_stage
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: "LIST @PSET2_DB.BRONZE.OPENALEX_WORKS_STAGE PATTERN = '.*[.]parquet$'"
    fetchType: FETCH

  - id: list_works_all_objects_under_stage
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: "LIST @PSET2_DB.BRONZE.OPENALEX_WORKS_STAGE"
    fetchType: FETCH

  - id: list_works_under_parquet_stage
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: "LIST @PSET2_DB.BRONZE.OPENALEX_PARQUET_STAGE PATTERN = '.*works/.*[.]parquet'"
    fetchType: FETCH

  - id: list_works_under_works_stage
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: "LIST @PSET2_DB.BRONZE.OPENALEX_WORKS_STAGE PATTERN = '.*works/.*[.]parquet'"
    fetchType: FETCH

  - id: works_table_metadata
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: >-
      SELECT COUNT(*) AS TABLE_COUNT
      FROM PSET2_DB.INFORMATION_SCHEMA.TABLES
      WHERE TABLE_SCHEMA = 'BRONZE'
        AND TABLE_NAME = 'RAW_OPENALEX_WORKS'
        AND TABLE_TYPE = 'BASE TABLE'
    fetchType: FETCH_ONE

  - id: works_diagnostics_if_table_exists
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.works_table_metadata.row.TABLE_COUNT > 0 }}"
    then:
      - id: works_table_row_count
        type: io.kestra.plugin.jdbc.snowflake.Query
        url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
        username: "{{ envs.snowflake_user }}"
        password: "{{ envs.snowflake_password }}"
        sql: "SELECT COUNT(*) AS ROW_COUNT FROM PSET2_DB.BRONZE.RAW_OPENALEX_WORKS"
        fetchType: FETCH_ONE
      - id: works_copy_history_last_14_days
        type: io.kestra.plugin.jdbc.snowflake.Query
        url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
        username: "{{ envs.snowflake_user }}"
        password: "{{ envs.snowflake_password }}"
        sql: >-
          SELECT FILE_NAME, STATUS, LAST_LOAD_TIME, ROW_COUNT, ROW_PARSED,
                 FIRST_ERROR_MESSAGE
          FROM TABLE(PSET2_DB.INFORMATION_SCHEMA.COPY_HISTORY(
            TABLE_NAME => 'PSET2_DB.BRONZE.RAW_OPENALEX_WORKS',
            START_TIME => DATEADD('day', -14, CURRENT_TIMESTAMP())
          ))
          ORDER BY LAST_LOAD_TIME DESC
        fetchType: FETCH
    else:
      - id: works_table_not_present
        type: io.kestra.plugin.core.log.Log
        message: "RAW_OPENALEX_WORKS no existe; su conteo y COPY_HISTORY no aplican."

  - id: authors_table_summary
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: >-
      SELECT COUNT(*) AS ROWS_IN_TABLE,
             COUNT(DISTINCT _SOURCE_FILE) AS DISTINCT_SOURCE_FILES,
             COUNT(DISTINCT _RUN_ID) AS DISTINCT_RUNS,
             MIN(_LOADED_AT) AS FIRST_LOADED_AT,
             MAX(_LOADED_AT) AS LAST_LOADED_AT
      FROM PSET2_DB.BRONZE.RAW_OPENALEX_AUTHORS
    fetchType: FETCH_ONE

  - id: authors_rows_by_source_file
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: >-
      SELECT _SOURCE_FILE, COUNT(*) AS ROWS_LOADED,
             COUNT(DISTINCT _RUN_ID) AS RUNS,
             MIN(_LOADED_AT) AS FIRST_LOADED_AT,
             MAX(_LOADED_AT) AS LAST_LOADED_AT
      FROM PSET2_DB.BRONZE.RAW_OPENALEX_AUTHORS
      GROUP BY _SOURCE_FILE
      ORDER BY LAST_LOADED_AT DESC
    fetchType: FETCH

  - id: authors_copy_history_last_14_days
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: >-
      SELECT FILE_NAME, STATUS, LAST_LOAD_TIME, ROW_COUNT, ROW_PARSED,
             FIRST_ERROR_MESSAGE
      FROM TABLE(PSET2_DB.INFORMATION_SCHEMA.COPY_HISTORY(
        TABLE_NAME => 'PSET2_DB.BRONZE.RAW_OPENALEX_AUTHORS',
        START_TIME => DATEADD('day', -14, CURRENT_TIMESTAMP())
      ))
      ORDER BY LAST_LOAD_TIME DESC
    fetchType: FETCH

  - id: authors_query_history_last_7_days
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: >-
      SELECT QUERY_ID, START_TIME, QUERY_TYPE, EXECUTION_STATUS,
             ERROR_MESSAGE, QUERY_TEXT
      FROM TABLE(PSET2_DB.INFORMATION_SCHEMA.QUERY_HISTORY(
        END_TIME_RANGE_START => DATEADD('day', -6, CURRENT_TIMESTAMP()),
        RESULT_LIMIT => 10000
      ))
      WHERE QUERY_TEXT ILIKE '%RAW_OPENALEX_AUTHORS%'
      ORDER BY START_TIME DESC
    fetchType: FETCH

  - id: authors_table_metadata
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: >-
      SELECT TABLE_CATALOG, TABLE_SCHEMA, TABLE_NAME, TABLE_TYPE,
             CREATED, LAST_ALTERED, ROW_COUNT, BYTES, RETENTION_TIME
      FROM PSET2_DB.INFORMATION_SCHEMA.TABLES
      WHERE TABLE_SCHEMA = 'BRONZE'
        AND TABLE_NAME = 'RAW_OPENALEX_AUTHORS'
    fetchType: FETCH_ONE

  - id: authors_payload_shape
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ envs.snowflake_account }}.snowflakecomputing.com/?warehouse={{ envs.snowflake_warehouse }}&db={{ envs.snowflake_database }}&role={{ envs.snowflake_role }}"
    username: "{{ envs.snowflake_user }}"
    password: "{{ envs.snowflake_password }}"
    sql: >-
      SELECT TYPEOF(PAYLOAD) AS PAYLOAD_TYPE,
             ARRAY_TO_STRING(OBJECT_KEYS(PAYLOAD), ',') AS PAYLOAD_KEYS,
             PAYLOAD:"id"::VARCHAR AS SAMPLE_ID
      FROM PSET2_DB.BRONZE.RAW_OPENALEX_AUTHORS
      LIMIT 1
    fetchType: FETCH_ONE

outputs:
  - id: session_context
    type: JSON
    value: "{{ outputs.snowflake_session_context.row }}"
  - id: bronze_stages
    type: JSON
    value: "{{ outputs.show_bronze_stages.rows }}"
  - id: bronze_file_formats
    type: JSON
    value: "{{ outputs.show_bronze_file_formats.rows }}"
  - id: bronze_tables
    type: JSON
    value: "{{ outputs.show_bronze_tables.rows }}"
  - id: authors_stage_definition
    type: JSON
    value: "{{ outputs.describe_authors_stage.rows }}"
  - id: works_stage_definition
    type: JSON
    value: "{{ outputs.describe_works_stage.rows }}"
  - id: authors_files
    type: JSON
    value: "{{ outputs.list_authors_files_under_dataset_prefix.rows }}"
  - id: works_files
    type: JSON
    value: "{{ outputs.list_works_files_under_stage.rows }}"
  - id: works_all_objects
    type: JSON
    value: "{{ outputs.list_works_all_objects_under_stage.rows }}"
  - id: works_from_parquet_stage
    type: JSON
    value: "{{ outputs.list_works_under_parquet_stage.rows }}"
  - id: works_from_works_stage
    type: JSON
    value: "{{ outputs.list_works_under_works_stage.rows }}"
  - id: works_table_exists
    type: JSON
    value: "{{ outputs.works_table_metadata.row }}"
  - id: authors_summary
    type: JSON
    value: "{{ outputs.authors_table_summary.row }}"
  - id: authors_by_source_file
    type: JSON
    value: "{{ outputs.authors_rows_by_source_file.rows }}"
  - id: authors_copy_history
    type: JSON
    value: "{{ outputs.authors_copy_history_last_14_days.rows }}"
  - id: authors_query_history
    type: JSON
    value: "{{ outputs.authors_query_history_last_7_days.rows }}"
  - id: authors_table_metadata
    type: JSON
    value: "{{ outputs.authors_table_metadata.row }}"
  - id: authors_payload_shape
    type: JSON
    value: "{{ outputs.authors_payload_shape.row }}"
