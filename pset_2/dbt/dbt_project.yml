# Esqueleto inicial. [ROL 2] es dueno de este archivo: ajustenlo libremente.
name: pset2
version: "1.0.0"
config-version: 2
profile: pset2

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  pset2:
    # Eventos historicos estaticos -> incremental + append (insert only), sin escaneos completos.
    silver:
      +schema: SILVER
      +materialized: incremental
      +incremental_strategy: append
    gold:
      +schema: GOLD
      +materialized: incremental
      +incremental_strategy: append
